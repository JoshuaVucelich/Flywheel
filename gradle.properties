org.gradle.jvmargs = -Xmx3G --add-modules=jdk.zipfs --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
org.gradle.daemon = false
# Common metadata
mod_license = MIT
mod_sources = https://github.com/Engine-Room/Flywheel
mod_issues = https://github.com/Engine-Room/Flywheel/issues
mod_homepage = https://github.com/Engine-Room/Flywheel
# Flywheel metadata
flywheel_id=flywheel
flywheel_name=Flywheel
flywheel_version=1.0.6-beta
flywheel_description=An overhauled entity and block entity rendering API.
# Vanillin metadata
vanillin_id=vanillin
vanillin_name=Vanillin
vanillin_version=1.1.3
vanillin_description=Instanced rendering for entities and block entities via Flywheel.
# Vanillin dependencies
flywheel_maven_version_range=[1.0.0,2.0)
flywheel_semver_version_range=>=1.0.0 <2.0.0

# Mod dependency declarations
minecraft_semver_version_range = >=26.1.2 <26.1.3
minecraft_maven_version_range = [26.1.2,26.1.3)
fabric_api_version_range = >=0.150.0
neoforge_version_range = [26.1.2,)

# General build dependency versions
java_version = 25
arch_loom_version = 1.17.491
cursegradle_version = 1.4.0
parchment_minecraft_version = 26.1.2
parchment_version = none
use_remapping = false

# Minecraft build dependency versions
minecraft_version = 26.1.2
neoforge_version = 26.1.2.75
fabric_loader_version = 0.19.3
fabric_api_version = 0.150.0+26.1.2

# Build dependency mod versions - optional compat, may be missing for 26.1
sodium_version = mc26.1.2-0.6.9
iris_version = 1.8.0+mc26.1.2
embeddium_version = 1.0.11+mc26.1.2

# Publication info
flywheel_group=dev.engine-room.flywheel
vanillin_group=dev.engine-room.vanillin
artifact_minecraft_version = 26.1
